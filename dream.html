<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>T2T Field Guide — Dream Phase</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,700;1,400&family=Caveat:wght@400;600&display=swap" rel="stylesheet">
<style>
  html,body{height:100%;background:#d0d0d0}
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Playfair Display',Georgia,serif;display:flex;align-items:center;justify-content:center;padding:16px;min-height:100%}
  .fg{font-family:'Playfair Display',Georgia,serif;width:100%;max-width:680px;margin:0 auto;border:2px solid #999;border-radius:14px;overflow:hidden;box-shadow:0 4px 24px rgba(0,0,0,.18);position:relative;user-select:none;-webkit-user-select:none;cursor:default}
  .fg input,.fg textarea{user-select:text;-webkit-user-select:text;cursor:text}
  .sc{display:none!important;pointer-events:none}
  .sc.active{display:flex!important;flex-direction:column;pointer-events:auto}
  .card{min-height:440px;border-radius:12px 12px 0 0;overflow:hidden;flex:1;display:flex;flex-direction:column}
  .bar2{display:flex;justify-content:center;align-items:center;gap:12px;padding:10px 16px;border-top:1px solid rgba(255,255,255,.15)}
  .tb{width:80px;height:36px;border-radius:8px;cursor:pointer;font-size:18px;display:flex;align-items:center;justify-content:center;transition:border-color .15s,background .15s}
  .tb:hover:not(.dim){border-color:#5b9bd5}
  .tb.dim{opacity:.32;cursor:default;pointer-events:none}
  .bar-dream-pp{background:#1a3a5c;border:2px solid #14305a;border-top:1px solid #2a5080}
  .bar-dream-pp .tb{background:#d6eaf8!important;border:1px solid #a9cce3;color:#1a3a5c}
  .bar-dream-pp .tb:hover:not(.dim){background:#5b9bd5!important;border-color:#5b9bd5;color:#fff}
  .sw{flex:1;display:flex;flex-direction:column;padding:28px 32px;background:#ffffff;overflow-y:auto}
  .title-stage{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:32px 24px 20px;background:#e4e0d8;text-align:center}
  .phase-eyebrow{font-size:10px;letter-spacing:5px;text-transform:uppercase;color:#7a6040;margin-bottom:24px}
  .phase-the{font-size:24px;font-weight:400;font-style:italic;color:#2a1f0e;line-height:1.1}
  .phase-name{font-size:72px;font-weight:700;color:#1a3a5c;line-height:1.0;letter-spacing:-2px}
  .phase-word{font-size:24px;font-weight:400;font-style:italic;color:#2a1f0e;line-height:1.2}
  .phase-sub{font-size:10px;letter-spacing:4px;color:#7a6040;opacity:.7;margin-top:28px;text-transform:uppercase}
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="backpack.js"></script>
</head>
<body>
<div class="fg" id="fg-root">

  <div class="sc card active" id="s-dream">
    <div class="title-stage">
      <div class="phase-eyebrow">· Phase One ·</div>
      <div class="phase-the">The</div>
      <div class="phase-name">Dream</div>
      <div class="phase-word">Phase</div>
      <div class="phase-sub">Create &nbsp;·&nbsp; Shape &nbsp;·&nbsp; Share</div>
    </div>
    <div class="bar2 bar-dream-pp">
      <button class="tb" id="b-dream-back">⬅️</button>
      <button class="tb" id="b-dream-mg">🔍</button>
      <button class="tb" id="b-dream-fwd">➡️</button>
    </div>
  </div>

</div><!-- .fg -->

<script>
document.addEventListener('DOMContentLoaded', function(){
  var T = window.T2T;

  T.setPrimaryPages(['s-dream']);
  T.registerPageNum('s-dream', '1000');
  T.registerCtx('s-dream', 'The Dream Phase');

  T.registerTrivia('s-dream', [
    {text:'Walt Disney described dreaming as "a kind of pleasant madness." T2T calls it the beginning of everything.', attr:'T2T Trivia'},
    {text:'Every great invention started as a thought someone wasn\'t sure they were allowed to have.', attr:'T2T Field Guide'},
    {text:'The word "dream" comes from the Old English drēam — which originally meant joy, music, and noise. Dreams were never meant to be quiet.', attr:'Etymology Trivia'},
    {text:'Einstein said imagination is more important than knowledge. The Dream Phase gives you permission to imagine first.', attr:'T2T Trivia'}
  ]);

  T.wire('b-dream-back', function(){ T.goPhase('index.html'); });
  T.wire('b-dream-mg',   T.goMG);
  T.wire('b-dream-fwd',  function(){ /* wire to 1100 CREATE when built */ });
});
</script>
</body>
</html>
