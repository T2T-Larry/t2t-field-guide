<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
<title>9221 — Sea of Ideas: Cluster</title>
<style>
  :root{
    --sky-top: #e8f3fb;
    --sky-bottom: #d4e9f7;
    --tile-bg: #ffffff;
    --tile-border: #cfe4f2;
    --ink: #1f3a4d;
    --ink-soft: #5b7f93;
    --accent: #3d8fbf;
    --accent-soft: #a9d2e7;
    --shadow: 0 6px 16px rgba(31,58,77,0.12);
    --shadow-lift: 0 14px 28px rgba(31,58,77,0.22);
    --warn: #b8562f;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color: transparent;}
  html,body{
    margin:0; padding:0; height:100%;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: linear-gradient(180deg, var(--sky-top), var(--sky-bottom));
    overscroll-behavior: none;
  }
  #app{
    position:relative;
    width:100%;
    height:100vh;
    overflow:hidden;
    touch-action:none;
  }
  #canvas{
    position:absolute;
    inset:0;
    background-image: radial-gradient(circle, rgba(61,143,191,0.15) 1px, transparent 1px);
    background-size: 28px 28px;
  }
  header{
    position:absolute; top:0; left:0; right:0;
    z-index:20;
    padding: 16px 18px 12px;
    background: linear-gradient(180deg, rgba(232,243,251,0.96) 60%, rgba(232,243,251,0));
    pointer-events:none;
  }
  header .row{
    display:flex; align-items:center; justify-content:space-between;
    pointer-events:auto;
  }
  h1{
    margin:0;
    font-size: 15px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--ink);
    font-weight: 700;
  }
  h1 .wave{ margin-right:6px; }
  p.sub{
    margin: 4px 0 0;
    font-size: 12.5px;
    color: var(--ink-soft);
    pointer-events:auto;
  }
  .btn{
    border:none;
    background: var(--tile-bg);
    color: var(--accent);
    border: 1px solid var(--tile-border);
    padding: 9px 14px;
    border-radius: 20px;
    font-size: 12.5px;
    font-weight: 600;
    box-shadow: var(--shadow);
    cursor:pointer;
  }
  .btn:active{ transform: translateY(1px); }
  .btn:disabled{ opacity:0.5; cursor:default; }

  .tile{
    position:absolute;
    width: 108px;
    height: 108px;
    border-radius: 14px;
    background: var(--tile-bg);
    border: 1px solid var(--tile-border);
    box-shadow: var(--shadow);
    overflow:hidden;
    cursor:grab;
    user-select:none;
    transition: box-shadow 120ms ease, transform 120ms ease;
    will-change: transform;
  }
  .tile.dragging{
    cursor:grabbing;
    box-shadow: var(--shadow-lift);
    z-index: 50;
    transition: none;
  }
  .tile img{
    width:100%; height:100%;
    object-fit: cover;
    display:block;
    pointer-events:none;
    draggable:false;
  }
  .tile.text{
    padding: 10px;
    display:flex;
    align-items:center;
    background: #fbfdff;
  }
  .tile.text p{
    margin:0;
    font-size: 11.5px;
    line-height:1.35;
    color: var(--ink);
    font-weight: 600;
    pointer-events:none;
  }

  .cluster-glow{
    position:absolute;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(61,143,191,0.16), transparent 70%);
    pointer-events:none;
    z-index: 5;
    transition: opacity 200ms ease;
  }
  .name-pill{
    position:absolute;
    z-index: 15;
    transform: translate(-50%, -50%);
    background: var(--accent);
    color:#fff;
    border:none;
    padding: 7px 13px;
    border-radius: 16px;
    font-size: 11.5px;
    font-weight: 700;
    box-shadow: var(--shadow);
    cursor:pointer;
    white-space:nowrap;
  }
  .name-pill.named{
    background:#fff;
    color: var(--ink);
    border: 1px solid var(--accent-soft);
  }

  footer{
    position:absolute; bottom:0; left:0; right:0;
    z-index:20;
    padding: 14px 18px 18px;
    display:flex; justify-content:space-between; align-items:center;
    background: linear-gradient(0deg, rgba(212,233,247,0.96) 55%, rgba(212,233,247,0));
    pointer-events:none;
  }
  footer > *{ pointer-events:auto; }
  .hint{
    font-size: 11.5px;
    color: var(--ink-soft);
    max-width: 200px;
    line-height:1.4;
  }
  .note{
    position:absolute;
    top: 62px; right: 18px;
    z-index: 20;
    font-size: 10.5px;
    color: var(--ink-soft);
    background: rgba(255,255,255,0.7);
    border: 1px solid var(--tile-border);
    padding: 5px 9px;
    border-radius: 10px;
    max-width: 220px;
    text-align:right;
  }
  .note.err{
    color: var(--warn);
    border-color: var(--warn);
    background: rgba(255,255,255,0.92);
  }

  .overlay{
    position:absolute; inset:0;
    z-index: 100;
    background: rgba(31,58,77,0.35);
    display:none;
    align-items:center;
    justify-content:center;
  }
  .overlay.active{ display:flex; }
  .overlay-card{
    background:#fff;
    border-radius: 18px;
    padding: 20px;
    width: min(320px, 86vw);
    box-shadow: var(--shadow-lift);
  }
  .overlay-card label{
    display:block;
    font-size: 12px;
    font-weight:700;
    color: var(--ink);
    margin-bottom: 8px;
  }
  .overlay-card input{
    width:100%;
    border: 1px solid var(--tile-border);
    border-radius: 10px;
    padding: 10px 12px;
    font-size: 14px;
    font-family: inherit;
    color: var(--ink);
    margin-bottom: 14px;
  }
  .overlay-actions{
    display:flex; gap:8px; justify-content:flex-end;
  }
  .overlay-actions .btn.cancel{ color: var(--ink-soft); }
  .overlay-actions .btn.save{ background: var(--accent); color:#fff; border-color: var(--accent); }
</style>
</head>
<body>

<div id="app">
  <div id="canvas"></div>

  <header>
    <div class="row">
      <div>
        <h1><span class="wave">🌊</span>Sea of Ideas — Cluster</h1>
        <p class="sub">Drag tiles near each other. Name a cluster once it feels settled.</p>
      </div>
      <button class="btn" id="shuffleBtn">↻ New batch</button>
    </div>
  </header>

  <div class="note" id="statusNote">Loading ideas…</div>

  <footer>
    <div class="hint">No AI here. Just move what feels connected.</div>
    <button class="btn" id="saveBtn">Save layout</button>
  </footer>

  <div class="overlay" id="nameOverlay">
    <div class="overlay-card">
      <label for="nameInput">What do you see here?</label>
      <input id="nameInput" type="text" placeholder="e.g. Time with people I love" maxlength="60">
      <div class="overlay-actions">
        <button class="btn cancel" id="nameCancel">Cancel</button>
        <button class="btn save" id="nameSave">Save</button>
      </div>
    </div>
  </div>
</div>

<script>
(function(){
  // ---- Live Supabase wiring -------------------------------------------
  const SUPABASE_URL = 'https://jyvvbjxqmxdgsxfcrfdn.supabase.co';
  const SUPABASE_ANON_KEY = 'sb_publishable_LADU6bQTx91yLtXdm4Xb4g_jLjQ6meh';
  const REST = SUPABASE_URL + '/rest/v1';
  const headers = {
    'apikey': SUPABASE_ANON_KEY,
    'Authorization': 'Bearer ' + SUPABASE_ANON_KEY,
    'Content-Type': 'application/json'
  };

  const app = document.getElementById('app');
  const canvas = document.getElementById('canvas');
  const statusNote = document.getElementById('statusNote');
  const BATCH_SIZE = 12;
  const TILE_SIZE = 108;
  const CLUSTER_RADIUS = 130; // px — glow + naming pill appear when tiles land within this range

  let positions = {};   // id -> {x,y}
  let currentBatch = []; // live idea rows: {id, content_type, image_url, text_content, cluster_id}
  let pool = [];          // larger fetched pool to sample batches from

  function setStatus(msg, isError){
    statusNote.textContent = msg;
    statusNote.classList.toggle('err', !!isError);
  }

  // Pull a generous pool of real, unclustered ideas (images + text), then
  // randomly sample a display batch client-side (PostgREST has no simple
  // ORDER BY random() over REST, so we over-fetch and shuffle here).
  async function fetchPool(){
    const url = REST + '/ideas?select=id,content_type,image_url,text_content,cluster_id'
      + '&content_type=in.(image,text)'
      + '&order=created_at.desc'
      + '&limit=80';
    const res = await fetch(url, { headers });
    if (!res.ok) {
      const body = await res.text();
      throw new Error('Fetch failed (' + res.status + '): ' + body.slice(0, 160));
    }
    return res.json();
  }

  function sampleBatch(n){
    const shuffled = [...pool].sort(() => Math.random() - 0.5);
    return shuffled.slice(0, n);
  }

  function randomStartPosition(w, h){
    const margin = 24;
    const topPad = 96;
    const bottomPad = 92;
    return {
      x: margin + Math.random() * (w - TILE_SIZE - margin * 2),
      y: topPad + Math.random() * (h - TILE_SIZE - topPad - bottomPad)
    };
  }

  function renderBatch(){
    canvas.querySelectorAll('.tile, .cluster-glow, .name-pill').forEach(el => el.remove());
    const w = app.clientWidth, h = app.clientHeight;

    currentBatch.forEach(item => {
      const pos = positions[item.id] || randomStartPosition(w, h);
      positions[item.id] = pos;

      const tile = document.createElement('div');
      tile.className = 'tile' + (item.content_type === 'text' ? ' text' : '');
      tile.dataset.id = item.id;
      tile.style.left = pos.x + 'px';
      tile.style.top = pos.y + 'px';

      if (item.content_type === 'image' && item.image_url) {
        const img = document.createElement('img');
        img.src = item.image_url;
        img.draggable = false;
        tile.appendChild(img);
      } else {
        const p = document.createElement('p');
        p.textContent = item.text_content || '(untitled idea)';
        tile.appendChild(p);
      }

      canvas.appendChild(tile);
      makeDraggable(tile);
    });

    updateClusterGlows();
  }

  function makeDraggable(tile){
    let offsetX = 0, offsetY = 0, dragging = false;

    function onPointerDown(e){
      dragging = true;
      tile.classList.add('dragging');
      const rect = tile.getBoundingClientRect();
      offsetX = e.clientX - rect.left;
      offsetY = e.clientY - rect.top;
      tile.setPointerCapture(e.pointerId);
    }
    function onPointerMove(e){
      if (!dragging) return;
      const appRect = app.getBoundingClientRect();
      let x = e.clientX - appRect.left - offsetX;
      let y = e.clientY - appRect.top - offsetY;
      x = Math.max(4, Math.min(app.clientWidth - TILE_SIZE - 4, x));
      y = Math.max(60, Math.min(app.clientHeight - TILE_SIZE - 80, y));
      tile.style.left = x + 'px';
      tile.style.top = y + 'px';
      positions[tile.dataset.id] = { x, y };
      updateClusterGlows();
    }
    function onPointerUp(e){
      dragging = false;
      tile.classList.remove('dragging');
      try { tile.releasePointerCapture(e.pointerId); } catch(err){}
    }

    tile.addEventListener('pointerdown', onPointerDown);
    tile.addEventListener('pointermove', onPointerMove);
    tile.addEventListener('pointerup', onPointerUp);
    tile.addEventListener('pointercancel', onPointerUp);
  }

  let activeGroupIds = null; // ids currently pending naming, set when pill tapped

  // Soft glows + a "+ name this" pill appear behind groups of 2+ tiles that
  // land close together. Pure proximity — nothing forces a name.
  function updateClusterGlows(){
    canvas.querySelectorAll('.cluster-glow, .name-pill').forEach(el => el.remove());

    const ids = Object.keys(positions).filter(id =>
      currentBatch.some(item => String(item.id) === id)
    );
    const visited = new Set();

    ids.forEach(id => {
      if (visited.has(id)) return;
      const group = [id];
      const p1 = positions[id];

      ids.forEach(otherId => {
        if (otherId === id || visited.has(otherId)) return;
        const p2 = positions[otherId];
        const dx = (p1.x - p2.x), dy = (p1.y - p2.y);
        if (Math.sqrt(dx*dx + dy*dy) < CLUSTER_RADIUS) {
          group.push(otherId);
        }
      });

      if (group.length > 1) {
        group.forEach(gid => visited.add(gid));
        const xs = group.map(g => positions[g].x + TILE_SIZE/2);
        const ys = group.map(g => positions[g].y + TILE_SIZE/2);
        const cx = xs.reduce((a,b)=>a+b,0)/xs.length;
        const cy = ys.reduce((a,b)=>a+b,0)/ys.length;
        const spread = Math.max(...group.map(g => {
          const dx = positions[g].x + TILE_SIZE/2 - cx;
          const dy = positions[g].y + TILE_SIZE/2 - cy;
          return Math.sqrt(dx*dx+dy*dy);
        })) + TILE_SIZE * 0.9;

        const glow = document.createElement('div');
        glow.className = 'cluster-glow';
        glow.style.width = glow.style.height = (spread * 2) + 'px';
        glow.style.left = (cx - spread) + 'px';
        glow.style.top = (cy - spread) + 'px';
        canvas.insertBefore(glow, canvas.firstChild);

        const namedItem = group.map(g => currentBatch.find(i => String(i.id) === g))
          .find(item => item && item._headerText);

        const pill = document.createElement('button');
        pill.className = 'name-pill' + (namedItem ? ' named' : '');
        pill.textContent = namedItem ? namedItem._headerText : '+ name this';
        pill.style.left = cx + 'px';
        pill.style.top = (cy - spread - 14) + 'px';
        pill.addEventListener('click', () => openNameOverlay(group, namedItem ? namedItem._headerText : ''));
        canvas.appendChild(pill);
      } else {
        visited.add(id);
      }
    });
  }

  // ---- Naming a cluster: writes a real "header" idea + stamps cluster_id ---
  const overlay = document.getElementById('nameOverlay');
  const nameInput = document.getElementById('nameInput');

  function openNameOverlay(groupIds, existingText){
    activeGroupIds = groupIds;
    nameInput.value = existingText || '';
    overlay.classList.add('active');
    setTimeout(() => nameInput.focus(), 50);
  }
  function closeNameOverlay(){
    overlay.classList.remove('active');
    activeGroupIds = null;
  }
  document.getElementById('nameCancel').addEventListener('click', closeNameOverlay);

  document.getElementById('nameSave').addEventListener('click', async () => {
    const text = nameInput.value.trim();
    if (!text || !activeGroupIds) { closeNameOverlay(); return; }
    const groupIds = activeGroupIds;
    closeNameOverlay();
    setStatus('Saving header…');

    try {
      const insertRes = await fetch(REST + '/ideas', {
        method: 'POST',
        headers: { ...headers, 'Prefer': 'return=representation' },
        body: JSON.stringify([{ content_type: 'header', text_content: text }])
      });
      if (!insertRes.ok) {
        const body = await insertRes.text();
        throw new Error('Header insert failed (' + insertRes.status + '): ' + body.slice(0, 200));
      }
      const [headerRow] = await insertRes.json();

      const idList = groupIds.join(',');
      const patchRes = await fetch(REST + '/ideas?id=in.(' + idList + ')', {
        method: 'PATCH',
        headers,
        body: JSON.stringify({ cluster_id: headerRow.id })
      });
      if (!patchRes.ok) {
        const body = await patchRes.text();
        throw new Error('cluster_id update failed (' + patchRes.status + '): ' + body.slice(0, 200)
          + ' — likely means the `cluster_id` column still needs to be added to `ideas`.');
      }

      groupIds.forEach(gid => {
        const item = currentBatch.find(i => String(i.id) === gid);
        if (item) item._headerText = text;
      });
      setStatus(currentBatch.length + ' ideas · header saved ✓');
      updateClusterGlows();
    } catch (err) {
      console.error(err);
      setStatus(err.message, true);
    }
  });

  document.getElementById('shuffleBtn').addEventListener('click', async () => {
    setStatus('Loading ideas…');
    try {
      pool = await fetchPool();
      currentBatch = sampleBatch(BATCH_SIZE);
      positions = {};
      renderBatch();
      setStatus(currentBatch.length + ' ideas · from Supabase');
    } catch (err) {
      console.error(err);
      setStatus(err.message, true);
    }
  });

  document.getElementById('saveBtn').addEventListener('click', () => {
    const payload = currentBatch.map(item => ({
      idea_id: item.id,
      x: Math.round(positions[item.id].x),
      y: Math.round(positions[item.id].y)
    }));
    console.log('layout (local only):', payload);
    const btn = document.getElementById('saveBtn');
    const original = btn.textContent;
    btn.textContent = 'Saved ✓';
    setTimeout(() => { btn.textContent = original; }, 1200);
  });

  window.addEventListener('resize', () => renderBatch());

  (async function init(){
    try {
      pool = await fetchPool();
      if (pool.length === 0) {
        setStatus('No ideas found yet in Supabase.', true);
        return;
      }
      currentBatch = sampleBatch(BATCH_SIZE);
      renderBatch();
      setStatus(currentBatch.length + ' ideas · from Supabase');
    } catch (err) {
      console.error(err);
      setStatus(err.message, true);
    }
  })();
})();
</script>

</body>
</html>
