<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>T2T Field Guide — Introduction (Desktop Scene Pilot)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,700;1,400&family=Caveat:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="theme-steampunk.css">
<link rel="stylesheet" href="book-engine.css">
<link rel="stylesheet" href="desktop-scene.css">
<style>
  body { margin:0; background:#fdf8f0; }
  .notes-overlay { display:none; position:fixed; inset:0; background:rgba(0,0,0,.45); align-items:center; justify-content:center; z-index:50; }
  .notes-overlay.open { display:flex; }
  .notes-panel { background:#fdf8f0; border:2px solid #C9A87C; border-radius:10px; padding:20px; width:340px; max-width:90%; }
  .notes-panel-head { display:flex; align-items:baseline; justify-content:space-between; margin-bottom:2px; }
  .notes-panel h3 { font-family:'Playfair Display',Georgia,serif; margin:0; font-size:16px; color:#3B2510; }
  .notes-page-indicator { font-size:11px; color:#8B6914; }
  .notes-date { font-size:12px; color:#8B6914; font-family:'Playfair Display',Georgia,serif; margin-bottom:8px; letter-spacing:.5px; }
  .notes-panel textarea { width:100%; min-height:160px; box-sizing:border-box; font-family:'Caveat',cursive; font-size:18px; border:1px solid #C9A87C; border-radius:6px; padding:10px; resize:vertical; }
  .notes-panel-controls { display:flex; align-items:center; gap:8px; margin-top:10px; }
  .notes-panel button { padding:8px 16px; border-radius:6px; border:1px solid #6b4a2c; background:#C9A87C; cursor:pointer; font-family:'Playfair Display',Georgia,serif; }
  .notes-nav-btn { padding:6px 12px; font-size:16px; }
  #notesClose { margin-left:auto; }
</style>
</head>
<body class="theme-steampunk">

<div class="desktop-scene theme-steampunk">

  <div class="desk-header-field">
    <div class="desk-brand">
      <div class="desk-brand-mark">T2T</div>
      <div class="desk-brand-title">Thoughts to Things</div>
      <div class="desk-nameplate">
        <div class="desk-nameplate-text" id="nameplateText">MEMBER NAME</div>
      </div>
    </div>

    <div class="desk-topic-title">Field Guide</div>

    <div class="desk-header-spacer"></div>
  </div>

  <div class="desk-map-row" id="mapRow" style="display:none">
    <div class="desk-map-track">
      <div class="desk-map-marker"></div>
    </div>
    <div class="desk-map-ticks">
      <span>1</span><span>2</span><span>3</span><span>4</span><span>5</span><span>6</span><span>7</span><span>8</span>
    </div>
  </div>

  <div class="desk-body">
    <div class="desk-notebook" tabindex="0" role="button" aria-label="Open Notes">
      <div class="desk-notebook-spiral"><span></span><span></span><span></span><span></span></div>
      <div class="desk-notebook-label"><span>Notes</span></div>
    </div>

    <div class="desk-book-slot">
      <div class="book-cover" id="bookCover" role="button" tabindex="0" aria-label="Open the Field Guide">
        <img class="book-cover-img" src="assets/cover.jpg" alt="T2T Thoughts to Things — Field Guide cover">
        <div class="book-cover-hint">Tap to open</div>
      </div>

      <div class="book-wrap" id="bookWrap" style="padding:0;display:none">
        <div class="book-frame">
          <div class="book-spread">
            <div class="book-page left">
              <div class="book-eyebrow"></div>
              <div class="book-title"></div>
              <div class="book-body"></div>
              <div class="book-folio"></div>
            </div>
            <div class="book-page right">
              <div class="book-eyebrow"></div>
              <div class="book-title"></div>
              <div class="book-body"></div>
              <div class="book-folio"></div>
            </div>
            <div class="book-turn-page"></div>
          </div>
          <button class="book-arrow prev" aria-label="Previous page">‹</button>
          <button class="book-arrow next" aria-label="Next page">›</button>
          <button class="book-close" id="bookClose" aria-label="Close book">×</button>
        </div>
      </div>
    </div>

    <div class="desk-tools">
      <button class="tool-btn" data-tool="map"><div class="tool-btn-face"><span>MAP</span></div></button>
      <button class="tool-btn" data-tool="idea-board"><div class="tool-btn-face"><span>Idea Board</span></div></button>
      <button class="tool-btn" data-tool="planning"><div class="tool-btn-face"><span>Planning</span></div></button>
      <button class="tool-btn" data-tool="organization"><div class="tool-btn-face"><span>Organization</span></div></button>
      <button class="tool-btn" data-tool="storytelling"><div class="tool-btn-face"><span>Storytelling</span></div></button>
      <button class="tool-btn" data-tool="briefing-board"><div class="tool-btn-face"><span>Briefing Board</span></div></button>
    </div>
  </div>

  <div class="desk-round-row">
    <div class="desk-toolbar-slot"></div>

    <div class="desk-toolbar-center">
      <div class="desk-round-btns">
        <div class="round-btn" data-tool="idea"><svg class="icon-svg" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-3 11.2c.6.4 1 1.1 1 1.8h4c0-.7.4-1.4 1-1.8A6 6 0 0 0 12 3z"/></svg></div>
        <div class="round-btn" data-tool="gems"><svg class="icon-svg" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3h12l4 6-10 12L2 9z"/></svg></div>
        <div class="round-btn" data-tool="trivia"><svg class="icon-svg" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="2.5"/><path d="M12 2a3 3 0 0 1 0 6 3 3 0 0 1 0-6zM12 16a3 3 0 0 1 0 6 3 3 0 0 1 0-6zM2 12a3 3 0 0 1 6 0 3 3 0 0 1-6 0zM16 12a3 3 0 0 1 6 0 3 3 0 0 1-6 0z"/></svg></div>
      </div>
    </div>

    <div class="desk-toolbar-slot"></div>
  </div>
</div>

<div class="notes-overlay" id="notesOverlay">
  <div class="notes-panel">
    <div class="notes-panel-head">
      <h3>Notes</h3>
      <span class="notes-page-indicator" id="notesPageIndicator">1 of 3</span>
    </div>
    <div class="notes-date" id="notesDate"></div>
    <textarea id="notesText" placeholder="Write anything, any time..."></textarea>
    <div class="notes-panel-controls">
      <button id="notesPrev" class="notes-nav-btn" aria-label="Previous notebook page">&lsaquo;</button>
      <button id="notesNext" class="notes-nav-btn" aria-label="Next notebook page">&rsaquo;</button>
      <button id="notesClose">Close</button>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="book-auth.js"></script>
<script src="book-engine.js"></script>
<script src="desktop-scene.js"></script>
<script>
  var pages = [
    { eyebrow: 'T2T', title: 'T2T', body: 'Thoughts to Things — A Choose Your Own Adventure Experience. By Larry Smithers & Bill Fritsch. Every great journey starts with a single step.', folio: '1' },
    { eyebrow: 'T2T', title: 'What is T2T?', body: 'T2T — Thoughts to Things — is a system for transforming imagination into reality. Not a philosophy. Not something you have to believe in before it works. A system. It works the first time you try it.', folio: '2' },
    { eyebrow: 'T2T', title: 'T2T Goals', body: 'May you find a clear Vision of what you really want, the Pursuit of Excellence in everything you do, and a Beautiful Journey for everyone involved.', folio: '3' },
    { eyebrow: '', title: 'Every great invention started as a thought.', body: 'The light bulb. The airplane. The internet. The vaccine. The symphony. Every single one — thought first. And every one of them began the same way. Someone answered one question.', folio: '4' },
    { eyebrow: 'THOUGHT', title: 'Thoughts happen.', body: 'We are constantly thinking. Thoughts occur both consciously and subconsciously.', folio: '5' },
    { eyebrow: 'THOUGHT', title: '5% conscious, 60,000 a day.', body: 'Conscious thoughts make up only about 5% of our total thoughts. Even at 5%, humans have more than 60,000 conscious thoughts per day.', folio: '6' },
    { eyebrow: 'THOUGHT', title: 'Thoughts with imagination.', body: 'But, don’t worry. Scientists tell us that 98 percent of those 60,000 thoughts are repeats from the day before. The other 2% are new thoughts. Walt Disney was fired from his first newspaper job for “lacking imagination and having no original ideas.”', folio: '7' },
    { eyebrow: '', title: 'What do you want?', body: '“Most people don’t know what they want, but they’re pretty sure they haven’t got it.” — Alfred E. Neuman', folio: '8' }
  ];

  var deskRoot = document.querySelector('.desktop-scene');
  var bookRoot = document.querySelector('.book-wrap');
  var bookCover = document.getElementById('bookCover');
  var bookWrap = document.getElementById('bookWrap');
  var bookClose = document.getElementById('bookClose');
  var bookApi = T2TBook.createBook(bookRoot, pages, []);
  function openBook() {
    bookCover.style.display = 'none';
    bookWrap.style.display = 'flex';
  }
  function closeBook() {
    bookWrap.style.display = 'none';
    bookCover.style.display = 'flex';
    bookApi.goTo(0);
  }
  bookCover.addEventListener('click', openBook);
  bookCover.addEventListener('keydown', function (e) {
    if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); openBook(); }
  });
  bookClose.addEventListener('click', closeBook);

  T2TDesktopScene.setNameplate(deskRoot, 'MEMBER NAME');
  T2TBookAuth.getMemberDisplayName('MEMBER NAME').then(function(name){
    T2TDesktopScene.setNameplate(deskRoot, name);
  });

  T2TDesktopScene.wireToolButtons(deskRoot, function (toolId) {
    console.log('Tool pressed:', toolId);
  });

  T2TDesktopScene.wireRoundButtons(deskRoot, function (toolId) {
    console.log('Round button pressed:', toolId);
  });

  var notesPages = ['', '', ''];
  var notesIdx = 0;
  var notesTextEl = document.getElementById('notesText');
  var notesDateEl = document.getElementById('notesDate');
  var notesIndicatorEl = document.getElementById('notesPageIndicator');

  function todayFormatted() {
    var d = new Date();
    return d.toLocaleDateString(undefined, { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });
  }

  function renderNotesPage() {
    notesTextEl.value = notesPages[notesIdx];
    notesIndicatorEl.textContent = (notesIdx + 1) + ' of ' + notesPages.length;
    notesDateEl.textContent = notesIdx === 0 ? todayFormatted() : '';
  }

  notesTextEl.addEventListener('input', function () {
    notesPages[notesIdx] = notesTextEl.value;
  });

  document.getElementById('notesPrev').addEventListener('click', function () {
    notesIdx = (notesIdx - 1 + notesPages.length) % notesPages.length;
    renderNotesPage();
  });
  document.getElementById('notesNext').addEventListener('click', function () {
    notesIdx = (notesIdx + 1) % notesPages.length;
    renderNotesPage();
  });

  T2TDesktopScene.wireNotebook(deskRoot, function () {
    notesIdx = 0;
    renderNotesPage();
    document.getElementById('notesOverlay').classList.add('open');
  });
  document.getElementById('notesClose').addEventListener('click', function () {
    document.getElementById('notesOverlay').classList.remove('open');
  });
</script>

</body>
</html>
