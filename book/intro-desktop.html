<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>T2T Field Guide — Introduction (Desktop Scene Pilot)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,700;1,400&family=Caveat:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="theme-steampunk.css">
<link rel="stylesheet" href="book-engine.css?v=8">
<link rel="stylesheet" href="desktop-scene.css?v=9">
<style>
  body { margin:0; background:#fdf8f0; }
  .notes-overlay { display:none; position:fixed; inset:0; background:rgba(0,0,0,.45); align-items:center; justify-content:center; z-index:50; }
  .notes-overlay.open { display:flex; }
  .notes-panel { background:#fdf8f0; border:2px solid #C9A87C; border-radius:10px; padding:20px; width:340px; max-width:90%; }
  .notes-panel-head { display:flex; align-items:baseline; justify-content:space-between; margin-bottom:2px; }
  .notes-panel h3 { font-family:'Playfair Display',Georgia,serif; margin:0; font-size:16px; color:#3B2510; }
  .notes-page-indicator { font-size:11px; color:#8B6914; }
  .notes-date { font-size:12px; color:#8B6914; font-family:'Playfair Display',Georgia,serif; margin-bottom:8px; letter-spacing:.5px; }
  .notes-panel textarea { width:100%; min-height:160px; box-sizing:border-box; font-family:'Caveat',cursive; font-size:18px; border:1px solid #C9A87C; border-radius:6px; padding:10px; resize:vertical; }
  .notes-panel-controls { display:flex; align-items:center; gap:8px; margin-top:10px; }
  .notes-panel button { padding:8px 16px; border-radius:6px; border:1px solid #6b4a2c; background:#C9A87C; cursor:pointer; font-family:'Playfair Display',Georgia,serif; }
  .notes-nav-btn { padding:6px 12px; font-size:16px; }
  #notesClose { margin-left:auto; }
</style>
</head>
<body class="theme-steampunk">

<div class="desktop-scene theme-steampunk">

  <div class="desk-header-field">
    <div class="desk-brand">
      <div class="desk-nameplate">
        <div class="desk-nameplate-header">Thoughts to Things</div>
        <div class="desk-nameplate-text" id="nameplateText">MEMBER NAME</div>
      </div>
    </div>

    <div class="desk-topic-frame" id="topicFrame" role="button" tabindex="0" aria-label="Open the Field Guide">
      <div class="desk-topic-title">Field Guide</div>
    </div>

    <div class="desk-header-spacer"></div>
  </div>

  <div class="desk-map-row" id="mapRow" style="display:none">
    <div class="desk-map-track">
      <div class="desk-map-marker"></div>
    </div>
    <div class="desk-map-ticks">
      <span>1</span><span>2</span><span>3</span><span>4</span><span>5</span><span>6</span><span>7</span><span>8</span>
    </div>
  </div>

  <div class="desk-body">
    <div class="desk-notebook" tabindex="0" role="button" aria-label="Open Notes">
      <div class="desk-notebook-spiral"><span></span><span></span><span></span><span></span></div>
      <div class="desk-notebook-label"><span>Notes</span></div>
    </div>

    <div class="desk-book-slot">
      <div class="book-cover" id="bookCover" role="button" tabindex="0" aria-label="Open the Field Guide">
        <img class="book-cover-img" src="assets/cover.jpg" alt="T2T Thoughts to Things — Field Guide cover" draggable="false">
      </div>

      <div class="book-wrap" id="bookWrap" style="padding:0;display:none">
        <div class="book-frame binder">
          <!-- Two 3/4-scale replicas of the live site's own widget
               shape (see the pages array below and .site-embed in
               book-engine.css), resting side by side on a plain dark
               green frame -- a placeholder standing in for a proper
               3-ring-binder object, which is its own project for
               later. Page-turn controls reuse the site's own .pg-btn
               look along the frame's bottom edge instead of a custom
               book-styled arrow. -->
          <div class="book-spread">
            <div class="book-page left"></div>
            <div class="book-page right"></div>
            <div class="book-turn-page"></div>
            <div class="binder-nav-row">
              <button class="book-arrow prev" aria-label="Previous page"><svg viewBox="0 0 14 14"><polygon points="10,2 4,7 10,12"/></svg></button>
              <span class="binder-page-indicator" id="binderPageIndicator"></span>
              <button class="book-arrow next" aria-label="Next page"><svg viewBox="0 0 14 14"><polygon points="4,2 10,7 4,12"/></svg></button>
            </div>
          </div>
          <!-- Phase dividers. Introduction and Dream jump to real
               pages; Believe/Dare/Journey are placeholders until those
               phases have their own Field Guide pages written --
               dimmed and inert rather than faked. -->
          <div class="binder-tabs">
            <button class="binder-tab" id="tabIntroduction" data-phase="introduction">Introduction</button>
            <button class="binder-tab" id="tabDream" data-phase="dream">Dream</button>
            <button class="binder-tab" id="tabBelieve" data-phase="believe" disabled>Believe</button>
            <button class="binder-tab" id="tabDare" data-phase="dare" disabled>Dare</button>
            <button class="binder-tab" id="tabJourney" data-phase="journey" disabled>Journey</button>
          </div>
        </div>
      </div>
    </div>

    <div class="desk-tools">
      <button class="tool-btn" data-tool="map"><div class="tool-btn-face"><span>MAP</span></div></button>
      <button class="tool-btn" data-tool="idea-board"><div class="tool-btn-face"><span>Idea Board</span></div></button>
      <button class="tool-btn" data-tool="planning"><div class="tool-btn-face"><span>Planning</span></div></button>
      <button class="tool-btn" data-tool="organization"><div class="tool-btn-face"><span>Organization</span></div></button>
      <button class="tool-btn" data-tool="storytelling"><div class="tool-btn-face"><span>Storytelling</span></div></button>
      <button class="tool-btn" data-tool="briefing-board"><div class="tool-btn-face"><span>Briefing Board</span></div></button>
    </div>
  </div>

  <div class="desk-round-row">
    <div class="desk-toolbar-slot"></div>

    <div class="desk-toolbar-center">
      <div class="desk-round-btns">
        <div class="round-btn" data-tool="idea"><svg class="icon-svg" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-3 11.2c.6.4 1 1.1 1 1.8h4c0-.7.4-1.4 1-1.8A6 6 0 0 0 12 3z"/></svg></div>
        <div class="round-btn" data-tool="gems"><svg class="icon-svg" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3h12l4 6-10 12L2 9z"/></svg></div>
        <div class="round-btn" data-tool="trivia"><svg class="icon-svg" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="2.5"/><path d="M12 2a3 3 0 0 1 0 6 3 3 0 0 1 0-6zM12 16a3 3 0 0 1 0 6 3 3 0 0 1 0-6zM2 12a3 3 0 0 1 6 0 3 3 0 0 1-6 0zM16 12a3 3 0 0 1 6 0 3 3 0 0 1-6 0z"/></svg></div>
      </div>
    </div>

    <div class="desk-toolbar-slot"></div>
  </div>
</div>

<div class="notes-overlay" id="notesOverlay">
  <div class="notes-panel">
    <div class="notes-panel-head">
      <h3>Notes</h3>
      <span class="notes-page-indicator" id="notesPageIndicator">1 of 3</span>
    </div>
    <div class="notes-date" id="notesDate"></div>
    <textarea id="notesText" placeholder="Write anything, any time..."></textarea>
    <div class="notes-panel-controls">
      <button id="notesPrev" class="notes-nav-btn" aria-label="Previous notebook page">&lsaquo;</button>
      <button id="notesNext" class="notes-nav-btn" aria-label="Next notebook page">&rsaquo;</button>
      <button id="notesClose">Close</button>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="book-auth.js"></script>
<script src="book-engine.js?v=4"></script>
<script src="desktop-scene.js?v=5"></script>
<!-- TEMPORARY pilot-only dev tool -- safe to delete this line and
     refresh-light.js once the book-view pilot is done. -->
<script src="refresh-light.js?v=4"></script>
<script>
  // Primary Field Guide pages only -- the site's own registered screen
  // numbers (see index.html's T.registerPageNum calls), embedded with
  // their own real markup and classes (see .site-embed in
  // book-engine.css) so each page looks like the actual live-site
  // screen, just shrunk to fit -- not the book's own simplified type.
  function embed(inner, folio) {
    return { html: '<div class="site-embed">' + inner + '</div><div class="book-folio">' + folio + '</div>' };
  }

  // Decimal-numbered screens (0100.1, 0100.2, ...) are Trivia, not
  // primary pages -- What is T2T and T2T Goals live there instead of
  // in this whole-number primary sequence.
  var pages = [
    // 0100 Cover
    embed(
      '<div class="cover">' +
        '<div class="t2t">T2T</div>' +
        '<div class="sub">Thoughts to Things</div>' +
        '<div class="rul"></div>' +
        '<div class="sm">A Choose Your Own Adventure Experience</div>' +
        '<div class="aut">By Larry Smithers &amp; Bill Fritsch</div>' +
        '<div class="tag">Every great journey starts with a single step.</div>' +
      '</div>', '1'),
    // 0200 Invention
    embed(
      '<div class="reader-wrap"><div class="reader-body">' +
        '<div class="reader-line bold" style="font-size:26px">🔹 Every great invention started as a thought.</div>' +
        '<div class="reader-spacer"></div>' +
        '<div class="reader-line small">The light bulb… The airplane… The internet…<br>The vaccine… The symphony.</div>' +
        '<div class="reader-spacer"></div>' +
        '<div class="reader-line bold">Every single one — thought first.</div>' +
      '</div></div>', '2'),
    // 0210 Thoughts 1
    embed(
      '<div class="reader-wrap"><div class="reader-body">' +
        '<div class="reader-eyebrow">THOUGHT</div>' +
        '<div class="reader-line bold">Thoughts happen.</div>' +
        '<div class="reader-spacer"></div>' +
        '<div class="reader-line">We are constantly thinking.</div>' +
        '<div class="reader-spacer"></div>' +
        '<div class="reader-line">Thoughts occur both consciously<br>and subconsciously.</div>' +
      '</div></div>', '3'),
    // 0211 Thoughts 2
    embed(
      '<div class="reader-wrap"><div class="reader-body">' +
        '<div class="reader-eyebrow">THOUGHT</div>' +
        '<div class="reader-line small">Conscious thoughts make up only about</div>' +
        '<div class="reader-line bold" style="font-size:40px">5%</div>' +
        '<div class="reader-line small">of our total thoughts. Even at 5%, humans have more than</div>' +
        '<div class="reader-line bold" style="font-size:28px">60,000</div>' +
        '<div class="reader-line small">conscious thoughts per day.</div>' +
      '</div></div>', '4'),
    // 0212 Thoughts 3
    embed(
      '<div class="reader-wrap"><div class="reader-body">' +
        '<div class="reader-eyebrow">THOUGHT</div>' +
        '<div class="reader-line italic small">But, don’t worry.</div>' +
        '<div class="reader-spacer"></div>' +
        '<div class="reader-line small">Scientists tell us that <strong>98 percent</strong> of those 60,000 thoughts are repeats from the day before. The other <strong>2%</strong> are new thoughts.</div>' +
        '<div class="reader-spacer"></div>' +
        '<div class="reader-line accent">🔹 Thoughts with imagination.</div>' +
      '</div></div>', '5'),
    // 0300 Want
    embed(
      '<div class="reader-wrap"><div class="reader-body">' +
        '<div class="reader-line bold" style="font-size:30px">What do you want?</div>' +
        '<div class="reader-spacer"></div>' +
        '<div class="reader-line italic small">🔹 “Most people don’t know what they want, but they’re pretty sure they haven’t got it.”</div>' +
        '<div class="reader-line small">— Alfred E. Neuman</div>' +
      '</div></div>', '6'),
    // 0400 Know -- real buttons kept for the real look, not wired to
    // branch anywhere; the book reads straight through instead.
    embed(
      '<div class="reader-wrap"><div class="reader-body">' +
        '<div class="reader-line bold" style="font-size:24px">Do you know what you want?</div>' +
        '<div class="reader-spacer"></div>' +
        '<div style="display:flex;gap:10px;justify-content:center">' +
          '<button style="padding:10px 18px;font-size:13px;font-weight:600;border-radius:8px;border:none;background:#E24B4A;color:#fff">No</button>' +
          '<button style="padding:10px 18px;font-size:13px;font-weight:600;border-radius:8px;border:none;background:#EF9F27;color:#fff">Sort of</button>' +
          '<button style="padding:10px 18px;font-size:13px;font-weight:600;border-radius:8px;border:none;background:#0F6E56;color:#fff">Yes</button>' +
        '</div>' +
      '</div></div>', '7'),
    // 0490 Dream Phase intro
    embed(
      '<div class="reader-wrap"><div class="reader-body">' +
        '<div class="reader-eyebrow">PHASE 1</div>' +
        '<div class="reader-line bold" style="font-size:26px">Dream Phase</div>' +
        '<div class="reader-spacer"></div>' +
        '<div class="reader-line italic small">You are about to discover what you want — maybe for the first time.</div>' +
      '</div></div>', '8')
  ];

  // Which spread each built phase tab opens to (the left index of the
  // pair -- pairAt(i) shows pages[i] and pages[i+1] together). Believe/
  // Dare/Journey stay disabled in the markup until those phases have
  // real pages of their own.
  var TAB_PAGE = { introduction: 0, dream: 6 };

  var deskRoot = document.querySelector('.desktop-scene');
  var bookCover = document.getElementById('bookCover');
  var bookWrap = document.getElementById('bookWrap');

  // Phase tabs and the page indicator both need to react on every
  // render (a tab click, the nav arrows, goTo(0) on close -- anything
  // that changes the current page), so this is wired as book-engine.js's
  // onRender callback instead of guessed at with a timeout after the
  // fact.
  var binderTabs = Array.prototype.slice.call(document.querySelectorAll('.binder-tab'));
  var pageIndicatorEl = document.getElementById('binderPageIndicator');
  function onBookRender(idx, total) {
    binderTabs.forEach(function (tab) {
      var target = TAB_PAGE[tab.dataset.phase];
      tab.classList.toggle('current', target !== undefined && target === idx);
    });
    if (pageIndicatorEl) {
      var shown = Math.min(idx + 2, total);
      pageIndicatorEl.textContent = (idx + 1) + (shown > idx + 1 ? '–' + shown : '') + ' of ' + total;
    }
  }

  // rootEl is the whole scene now, not just .book-wrap, so the page-nav
  // arrows (relocated next to the round buttons) can still be found and wired.
  var bookApi = T2TBook.createBook(deskRoot, pages, [], onBookRender);
  binderTabs.forEach(function (tab) {
    tab.addEventListener('pointerdown', function (e) { e.stopPropagation(); });
    tab.addEventListener('click', function () {
      var target = TAB_PAGE[tab.dataset.phase];
      if (target === undefined) return;
      bookApi.goTo(target);
    });
  });

  function openBook() {
    bookCover.style.display = 'none';
    bookWrap.style.display = 'flex';
  }
  function closeBook() {
    bookWrap.style.display = 'none';
    bookCover.style.display = 'flex';
    bookApi.goTo(0);
  }
  bookCover.addEventListener('click', openBook);
  bookCover.addEventListener('keydown', function (e) {
    if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); openBook(); }
  });

  var topicFrame = document.getElementById('topicFrame');
  topicFrame.addEventListener('click', openBook);
  topicFrame.addEventListener('keydown', function (e) {
    if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); openBook(); }
  });

  // No close (x) button anymore — clicking "previous" once past the first
  // page closes the book back to the cover, like flipping past the front cover.
  var pageNavPrev = document.querySelector('.book-frame .book-arrow.prev');
  if (pageNavPrev) {
    pageNavPrev.addEventListener('click', function () {
      if (bookApi.getIndex() === 0) closeBook();
    });
  }

  T2TDesktopScene.setNameplate(deskRoot, 'MEMBER NAME');
  T2TBookAuth.getMemberDisplayName('MEMBER NAME').then(function(name){
    T2TDesktopScene.setNameplate(deskRoot, name);
  });

  T2TDesktopScene.wireToolButtons(deskRoot, function (toolId) {
    console.log('Tool pressed:', toolId);
  });

  T2TDesktopScene.wireRoundButtons(deskRoot, function (toolId) {
    console.log('Round button pressed:', toolId);
  });

  // Lock in each row's height before any object goes absolute, so
  // picking one up (or loading it already in its saved/default spot)
  // doesn't shrink its row and shift everything else on the desk to
  // re-center.
  T2TDesktopScene.reserveRowHeights(['.desk-header-field', '.desk-body', '.desk-round-row']);

  T2TDesktopScene.makeDraggable(document.querySelector('.desk-nameplate'), 't2t-drag-nameplate', deskRoot);
  T2TDesktopScene.makeDraggable(document.querySelector('.desk-notebook'), 't2t-drag-notebook', deskRoot);
  T2TDesktopScene.makeDraggable(document.querySelector('.desk-book-slot'), 't2t-drag-bookslot', deskRoot);
  T2TDesktopScene.makeDraggable(document.querySelector('.desk-topic-frame'), 't2t-drag-topicframe', deskRoot);
  T2TDesktopScene.makeDraggable(document.querySelector('.desk-tools'), 't2t-drag-tools', deskRoot);
  T2TDesktopScene.makeDraggable(document.querySelector('.desk-round-btns'), 't2t-drag-roundbtns', deskRoot);
  // Draw a selection box over empty desk space to select several objects
  // at once; dragging any one of them afterward moves the whole group.
  T2TDesktopScene.enableLasso(deskRoot);

  // The page arrows now live inside the book itself (so they travel with
  // it) -- keep a press on them from also being read as "start dragging
  // the book."
  document.querySelectorAll('.book-frame .book-arrow').forEach(function (btn) {
    btn.addEventListener('pointerdown', function (e) { e.stopPropagation(); });
  });

  var notesPages = ['', '', ''];
  var notesIdx = 0;
  var notesTextEl = document.getElementById('notesText');
  var notesDateEl = document.getElementById('notesDate');
  var notesIndicatorEl = document.getElementById('notesPageIndicator');

  function todayFormatted() {
    var d = new Date();
    return d.toLocaleDateString(undefined, { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });
  }

  function renderNotesPage() {
    notesTextEl.value = notesPages[notesIdx];
    notesIndicatorEl.textContent = (notesIdx + 1) + ' of ' + notesPages.length;
    notesDateEl.textContent = notesIdx === 0 ? todayFormatted() : '';
  }

  notesTextEl.addEventListener('input', function () {
    notesPages[notesIdx] = notesTextEl.value;
  });

  document.getElementById('notesPrev').addEventListener('click', function () {
    notesIdx = (notesIdx - 1 + notesPages.length) % notesPages.length;
    renderNotesPage();
  });
  document.getElementById('notesNext').addEventListener('click', function () {
    notesIdx = (notesIdx + 1) % notesPages.length;
    renderNotesPage();
  });

  T2TDesktopScene.wireNotebook(deskRoot, function () {
    notesIdx = 0;
    renderNotesPage();
    document.getElementById('notesOverlay').classList.add('open');
  });
  document.getElementById('notesClose').addEventListener('click', function () {
    document.getElementById('notesOverlay').classList.remove('open');
  });
</script>

</body>
</html>
