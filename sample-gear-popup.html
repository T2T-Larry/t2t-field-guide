<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>T2T Field Guide — Sample Gear popup</title>
<!-- SAMPLE GEAR POPUP (Nov 16 2026, second version). Larry: the GEAR is the "Utilities Options"; no description, just a divider line and the three-way switches, scroll when needed.
     Each item has a three-way switch: STANDARD (in effect for this card and every card beneath, never shown on the card back; changed only here in the Gear)
     - OFF (not used; whatever was saved stays) - OPTION (a visible choice in this card's OPTIONS checklist, for this card and every card beneath).
     Nothing here is saved and nothing touches a real card. -->
<style>
:root{--bg:#fffdf6;--ink:#2b2b2b;--accent:#8a7a4a;--paper:#f3ecd9;--blue:#0075ff;--flag:#c2410c}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font:13px/1.3 Georgia,'Playfair Display',serif;padding:18px}
.stage{display:flex;flex-wrap:wrap;gap:22px;align-items:flex-start}
.box{background:var(--bg);border:1.5px solid var(--accent);border-radius:10px;box-shadow:0 6px 22px rgba(0,0,0,.18);padding:12px 14px}
.gear{width:min(360px,100%)}
.back{width:min(300px,100%)}
.title{font-size:11px;font-weight:700;letter-spacing:1px;text-transform:uppercase}
hr{border:0;border-top:1.5px solid var(--accent);margin:6px 0 2px}
#list{max-height:310px;overflow-y:auto;padding-right:4px}
.row{display:flex;align-items:center;gap:8px;min-height:30px;border-bottom:1px dotted var(--accent)}
.row:last-child{border-bottom:0}
.lab{flex:1;min-width:0;font-weight:700}
.pick{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:1px;font-weight:400;font-size:11px}
select{font:inherit;font-size:11px;padding:0 2px;border:1px solid var(--accent);border-radius:4px;background:#fff;max-width:130px}
.off{color:var(--flag);font-weight:700;letter-spacing:.5px;text-transform:uppercase;font-size:10px}
.link{background:none;border:0;padding:0;font:inherit;font-size:11px;color:var(--blue);text-decoration:underline;cursor:pointer}
.three{flex:0 0 auto;display:flex;border:1.5px solid var(--ink);border-radius:6px;overflow:hidden}
.three button{font:inherit;font-size:9.5px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;padding:3px 6px;border:0;border-right:1px solid var(--ink);background:#e4e4e4;color:var(--ink);cursor:pointer}
.three button:last-child{border-right:0}
.three button[aria-pressed="true"][data-v="standard"]{background:#2f6fb3;color:#fff}
.three button[aria-pressed="true"][data-v="off"]{background:#fff}
.three button[aria-pressed="true"][data-v="option"]{background:#5fb36b;color:#fff}
.cardtitle{font-weight:700;font-size:14px;margin:0 0 6px}
.opt{display:flex;align-items:center;gap:8px;min-height:24px;font-size:11px;font-weight:700;letter-spacing:1px;text-transform:uppercase}
.tri{appearance:none;-webkit-appearance:none;position:relative;width:15px;height:15px;margin:0;border:1px solid #767676;border-radius:2px;background:#fff;cursor:pointer;flex:0 0 auto}
.tri[data-st="1"]::after,.tri[data-st="2"]::after{content:"\2713";position:absolute;left:1px;top:-2px;font-size:13px;font-weight:700;color:var(--blue)}
.tri[data-st="2"]{background:#dbe9ff}
.empty{opacity:.6;font-style:italic;padding:6px 0}
.note{margin:8px 0 0;font-size:11px;opacity:.65}
</style>
</head>
<body>
<div class="stage">
  <div class="box gear">
    <div class="title">Gear</div>
    <hr>
    <div id="list"></div>
  </div>

  <div class="box back">
    <div class="cardtitle">Pick the venue</div>
    <div class="title" style="margin-bottom:4px">Options</div>
    <div id="options"></div>
    <p class="note">Click a check: back, then back and front, then hidden.</p>
  </div>
</div>

<script>
/* v: 'standard' | 'off' | 'option'.  A item with choices (Brand ...) also has a value; the header's value is the standard, and a card can step outside it. */
var ITEMS=[
  {key:'brand',   label:'Brand',         v:'standard', choices:['Spruce & Gold','Harbor Blue','Plain'], header:'Spruce & Gold', val:'Spruce & Gold'},
  {key:'color',   label:'Card color',    v:'standard', choices:['Task gold','Idea blue','Note green'],  header:'Task gold',     val:'Task gold'},
  {key:'subject', label:'Subject look',  v:'standard', choices:['Bold CAPS','Bold','Plain'],            header:'Bold CAPS',     val:'Bold CAPS'},
  {key:'budget',  label:'Budget',        v:'off'},
  {key:'dates',   label:'Dates',         v:'option'},
  {key:'flags',   label:'Flags',         v:'off'},
  {key:'library', label:'Library',       v:'off'},
  {key:'links',   label:'Links',         v:'off'},
  {key:'org',     label:'Organization',  v:'off'},
  {key:'priority',label:'Priority',      v:'option'},
  {key:'routine', label:'Routine',       v:'off'}
];
var step={};   // OPTIONS check: 0 hidden, 1 back, 2 back and front
function $(id){ return document.getElementById(id); }

function paintGear(){
  var box=$('list'), keep=box.scrollTop; box.innerHTML='';
  ITEMS.forEach(function(it){
    var row=document.createElement('div'); row.className='row';
    var lab=document.createElement('div'); lab.className='lab'; lab.textContent=it.label;
    if(it.choices && it.v==='standard'){
      var pick=document.createElement('div'); pick.className='pick';
      var sel=document.createElement('select');
      it.choices.forEach(function(c){ var o=document.createElement('option'); o.textContent=c; if(c===it.val) o.selected=true; sel.appendChild(o); });
      sel.onchange=function(){ it.val=sel.value; paintAll(); };
      pick.appendChild(sel);
      if(it.val!==it.header){
        var tag=document.createElement('span'); tag.className='off'; tag.textContent='Off standard';
        var back=document.createElement('button'); back.type='button'; back.className='link'; back.textContent='Back to '+it.header;
        back.onclick=function(){ it.val=it.header; paintAll(); };
        pick.appendChild(tag); pick.appendChild(back);
      }
      lab.appendChild(pick);
    }
    var three=document.createElement('div'); three.className='three'; three.setAttribute('role','group'); three.setAttribute('aria-label',it.label);
    [['standard','Standard'],['off','Off'],['option','Option']].forEach(function(p){
      var b=document.createElement('button'); b.type='button'; b.setAttribute('data-v',p[0]); b.textContent=p[1]; b.setAttribute('aria-pressed',it.v===p[0]);
      b.onclick=function(){ it.v=p[0]; if(p[0]!=='option') step[it.key]=0; paintAll(); };
      three.appendChild(b);
    });
    row.appendChild(lab); row.appendChild(three); box.appendChild(row);
  });
  box.scrollTop=keep;
}

function paintOptions(){
  var box=$('options'); box.innerHTML='';
  var items=ITEMS.filter(function(i){ return i.v==='option'; }).sort(function(a,b){ return a.label<b.label?-1:1; });
  if(!items.length){ box.innerHTML='<div class="empty">Nothing set to Option.</div>'; return; }
  items.forEach(function(it){
    var row=document.createElement('div'); row.className='opt';
    var cb=document.createElement('input'); cb.type='checkbox'; cb.className='tri'; cb.setAttribute('data-st',step[it.key]||0);
    cb.onclick=function(e){ e.preventDefault(); step[it.key]=((step[it.key]||0)+1)%3; paintOptions(); };
    var t=document.createElement('span'); t.textContent=it.label;
    row.appendChild(cb); row.appendChild(t); box.appendChild(row);
  });
}
function paintAll(){ paintGear(); paintOptions(); }
paintAll();
</script>
</body>
</html>
