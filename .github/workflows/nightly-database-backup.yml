name: Nightly database backup to Google Drive

# Every night: dump the Supabase database, upload it to a Google Drive folder,
# and keep roughly the last 14 days. Run it by hand any time from the Actions tab
# (Run workflow button) to test.

on:
  schedule:
    - cron: "17 7 * * *"   # 7:17 UTC = 3:17 AM Eastern (2:17 AM in winter)
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Install Postgres 17 client and rclone
        # GitHub's runners sometimes cannot reach the package servers for a few
        # minutes (a temporary network lookup failure). Try up to 5 times, with a
        # pause between tries, and give up on each try quickly instead of hanging.
        run: |
          for attempt in 1 2 3 4 5; do
            echo "Install attempt $attempt of 5"
            if sudo install -d /usr/share/postgresql-common/pgdg \
              && sudo curl -fsSL --retry 3 --retry-delay 5 --max-time 60 -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc \
              && echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list \
              && sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 update -qq \
              && sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 install -y -qq postgresql-client-17 rclone; then
              exit 0
            fi
            sleep $((attempt * 20))
          done
          echo "::error title=Could not install backup tools::The package servers were unreachable after 5 tries"
          exit 1

      - name: Dump the database
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          STAMP=$(date -u +%Y-%m-%d_%H%M)
          FILE="field-guide-backup_${STAMP}.dump"
          if ! /usr/lib/postgresql/17/bin/pg_dump "$SUPABASE_DB_URL" \
            --format=custom --no-owner --no-privileges \
            --schema=public --schema=auth --schema=storage \
            --file="$FILE" 2> dump-error.txt; then
            MSG=$(tr '\n' ' ' < dump-error.txt | sed -E 's#postgres(ql)?://[^ ]*#[address hidden]#g')
            echo "::error title=Database dump failed::${MSG}"
            exit 1
          fi
          ls -l "$FILE"
          echo "BACKUP_FILE=$FILE" >> "$GITHUB_ENV"

      - name: Upload to Google Drive and keep the last 14 days
        env:
          DRIVE_RCLONE_TOKEN: ${{ secrets.DRIVE_RCLONE_TOKEN }}
          DRIVE_FOLDER_ID: ${{ secrets.DRIVE_FOLDER_ID }}
        run: |
          export RCLONE_CONFIG_BACKUP_TYPE=drive
          export RCLONE_CONFIG_BACKUP_SCOPE=drive
          export RCLONE_CONFIG_BACKUP_TOKEN="$DRIVE_RCLONE_TOKEN"
          export RCLONE_CONFIG_BACKUP_ROOT_FOLDER_ID="$DRIVE_FOLDER_ID"
          rclone copy "$BACKUP_FILE" BACKUP:
          rclone delete BACKUP: --min-age 15d
          rclone ls BACKUP:
